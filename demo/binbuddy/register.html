<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BinBuddy - สร้างบัญชี</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f9fafb; }
        .profile-upload { position: relative; cursor: pointer; transition: all 0.3s; }
        .profile-upload:hover { transform: scale(1.02); }
        .upload-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s; border-radius: 9999px;
        }
        .profile-upload:hover .upload-overlay { opacity: 1; }
        .avatar-container { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    </style>
</head>
<body>
    <div class="max-w-md mx-auto p-6 bg-white rounded-lg shadow-lg mt-10 mb-10">
        <h1 class="text-2xl font-bold text-green-600 text-center mb-6"><i class="fas fa-recycle mr-1"></i>BinBuddy</h1>
        <p class="text-center text-gray-600 mb-6">สร้างบัญชีใหม่เพื่อเริ่มการแยกขยะ</p>
        <form id="registerForm">
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">ชื่อ-นามสกุล</label>
                <input type="text" name="name" id="regName" class="w-full px-3 py-2 border rounded-lg" required>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">อีเมล</label>
                <input type="email" name="email" id="regEmail" class="w-full px-3 py-2 border rounded-lg" required>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">รหัสผ่าน</label>
                <input type="password" name="password" id="password" class="w-full px-3 py-2 border rounded-lg" required autocomplete="new-password">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">ยืนยันรหัสผ่าน</label>
                <input type="password" name="confirm_password" id="confirm_password" class="w-full px-3 py-2 border rounded-lg" required>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">รูปโปรไฟล์</label>
                <div class="avatar-container">
                    <div class="profile-upload">
                        <img id="previewImage" src="https://api.dicebear.com/9.x/avataaars/svg?seed=guest" alt="Profile" class="w-24 h-24 rounded-full object-cover border-4 border-white shadow-lg">
                        <div class="upload-overlay">
                            <label for="profileImageUpload" class="cursor-pointer text-white text-center">
                                <i class="fas fa-camera text-xl mb-1"></i>
                                <p class="text-xs">เลือกรูปภาพ</p>
                                <input type="file" id="profileImageUpload" name="profile_image" accept="image/*" class="hidden">
                            </label>
                        </div>
                    </div>
                    <button type="button" id="randomAvatar" class="border border-gray-400 text-gray-600 rounded-full w-10 h-10 flex items-center justify-center hover:text-gray-800 hover:border-gray-600">
                        <i class="fas fa-random"></i>
                    </button>
                </div>
                <p class="text-sm text-gray-500 mt-2">ขนาดไฟล์สูงสุด: 5MB (รองรับ: JPG, PNG, GIF)</p>
            </div>
            <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700">ลงทะเบียน</button>
            <p class="text-center text-gray-500 mt-4">มีบัญชีอยู่แล้ว? <a href="login.html" class="text-green-600">เข้าสู่ระบบ</a></p>
            <p class="text-center text-gray-400 text-xs mt-3">โหมดเดโม — การลงทะเบียนเป็นตัวอย่าง ไม่ได้บันทึกข้อมูลจริง</p>
        </form>
    </div>

    <script>
        let currentAvatarSeed = Math.random().toString(36).substring(7);
        function setAvatar() {
            document.getElementById('previewImage').src = `https://api.dicebear.com/9.x/avataaars/svg?seed=${currentAvatarSeed}`;
        }
        setAvatar();

        document.getElementById('randomAvatar').addEventListener('click', function () {
            currentAvatarSeed = Math.random().toString(36).substring(7);
            setAvatar();
        });

        document.getElementById('profileImageUpload').addEventListener('change', function (event) {
            const file = event.target.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) {
                Swal.fire({ icon: 'error', title: 'ข้อผิดพลาด', text: 'ไฟล์มีขนาดเกิน 5MB', confirmButtonColor: '#10b981' });
                this.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = e => { document.getElementById('previewImage').src = e.target.result; };
            reader.readAsDataURL(file);
        });

        document.getElementById('registerForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            if (password !== confirmPassword) {
                Swal.fire({ icon: 'error', title: 'ข้อผิดพลาด', text: 'รหัสผ่านและรหัสผ่านยืนยันไม่ตรงกัน', confirmButtonColor: '#10b981' });
                return;
            }
            Swal.fire({
                icon: 'success',
                title: 'สำเร็จ',
                text: 'ลงทะเบียนสำเร็จ! (โหมดเดโม — เข้าสู่ระบบเป็นผู้เยี่ยมชม)',
                confirmButtonColor: '#10b981'
            }).then(() => { window.location.href = 'home.html'; });
        });
    </script>
</body>
</html>
