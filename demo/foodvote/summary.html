<!DOCTYPE html>
<html lang="th">
<head>
    <script src="js/demo-shim.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Access-Control-Allow-Origin" content="*">
    <title>สรุปผลโหวตอาหาร</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/summary.css?v=1.0.3">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4caf50',
                        secondary: '#2196F3',
                        'primary-dark': '#45a049',
                        'primary-light': '#e8f5e9',
                        'secondary-dark': '#1976D2',
                    },
                    fontFamily: {
                        'prompt': ['Prompt', 'sans-serif'],
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-gray-100 font-prompt text-gray-800">
    <div class="container mx-auto px-4 py-4 max-w-4xl">
        <!-- ส่วนหัว -->
        <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
            <button id="back-btn" class="back-btn flex items-center text-gray-600 hover:text-primary">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 sm:h-5 sm:w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                กลับ
            </button>
            <div class="flex flex-col items-center justify-center flex-1">
                <h1 class="text-xl sm:text-2xl font-semibold text-primary">สรุปผลโหวตอาหาร</h1>
                <div class="flex items-center justify-center gap-2">
                    <button id="prev-date-btn" class="text-gray-600 hover:text-primary transition-all duration-200">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                        </svg>
                    </button>
                    <div class="relative">
                        <p id="date-display" class="text-gray-500 text-sm cursor-pointer hover:text-primary transition-all duration-200"></p>
                        <input type="date" id="date-picker" class="absolute inset-0 opacity-0 cursor-pointer">
                    </div>
                    <button id="next-date-btn" class="text-gray-600 hover:text-primary transition-all duration-200" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="refresh-btn" class="refresh-btn flex items-center text-gray-600 hover:text-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 sm:h-5 sm:w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    รีเฟรช
                </button>
            </div>
        </div>

        <!-- ข้อความแจ้งเตือน -->
        <div id="summary-error" class="bg-red-50 text-red-600 p-2 sm:p-3 rounded-lg mb-4 text-center hidden"></div>
<div id="summary-success" class="bg-green-50 text-green-600 p-2 sm:p-3 rounded-lg mb-4 text-center flex items-center justify-center gap-2 hidden">
    <svg class="checkmark w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path class="checkmark__path" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
    </svg>
    <span>ข้อมูลอัปเดตแล้ว</span>
</div>

        <!-- ส่วนแสดงสรุป -->
        <div id="summary-content" class="summary-card animate-fade-in">
            <div id="loading-container" class="loading-container" style="display: none;">
                <div class="loader"></div>
                <p class="text-gray-600 text-sm">กำลังโหลดข้อมูล...</p>
            </div>
            <div id="content-container" class="content-container" style="display: block;">
                <div class="flex flex-col mb-3">
                    <div class="flex justify-between items-center">
                        <h2 class="text-base sm:text-lg font-medium text-gray-800">สรุปผลโหวตวันที่</h2>
                        <select id="mode-switch" class="border border-gray-300 rounded-lg p-1 text-sm text-gray-600 focus:outline-none focus:ring-2 focus:ring-primary">
                            <option value="all">รวมทั้งหมด</option>
                            <option value="free">รายการฟรี</option>
                            <option value="paid">รายการเสียเงิน</option>
                        </select>
                    </div>
                </div>
                
                <div class="summary-item">
                    <span id="total-items-label" class="font-medium">จำนวนรายการทั้งหมด:</span>
                    <span id="total-items" class="text-primary font-semibold">0</span>
                </div>
                <div class="summary-item">
                    <span id="total-cost-label" class="font-medium">ยอดรวมทั้งหมด:</span>
                    <span id="total-cost" class="text-primary font-semibold">0 บาท</span>
                </div>
                <textarea id="menu-list" class="summary-textarea" readonly=""></textarea>
            </div>
        </div>

        <!-- ปุ่มคัดลอก -->
        <button id="copy-btn" class="copy-btn">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
            </svg>
            คัดลอกผลสรุป
        </button>
    </div>

    <!-- Firebase SDK -->
<!-- LIFF SDK -->
<!-- Luxon for date handling -->
    <script src="https://moment.github.io/luxon/global/luxon.min.js"></script>

    <!-- ตรรกะของหน้าสรุป -->
    <script src="js/summary.js?v=1.0.5"></script>
</body>
</html>
